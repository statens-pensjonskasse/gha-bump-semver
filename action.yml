name: GHA Bump SemVer
description: Bump a semver version up.
author: Statens Pensjonskasse

inputs:
  current_version:
    description: The current version.
    required: true
  level:
    description: A semver update level ({major, premajor, minor, preminor, patch, prepatch, prerelease}).
    required: false
    default: minor
outputs:
  new_version:
    description: The bumped semver version.
runs:
  using: node24
  main: dist/index.js
branding:
  icon: bookmark
  color: white
